[project]
name = "llm-steganography"
version = "0.1.0"
description = "Keyed steganography for local and hosted language models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Cofob"
license-files = ["LICENSE"]
dependencies = [
    "blake3>=1.0.5,<2",
    "httpx>=0.28,<1",
    "llm-steganography-sglang",
    "numpy>=2.1,<3",
    "pillow>=11,<13",
    "reedsolo>=1.7,<2",
    "torch>=2.7,<3",
    "tqdm>=4.67,<5",
    "torchvision>=0.22,<1",
    "transformers>=5.16.1,<6",
    "litestar>=2.18,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.urls]
License = "https://cofob.dev/license/"

[project.scripts]
llm-steg = "llm_steganography.cli:main"
llm-steg-api = "llm_steganography_api.app:run"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "types-tqdm>=4.67,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_steganography", "src/llm_steganography_api"]

[tool.uv.sources]
llm-steganography-sglang = { workspace = true }

[tool.uv.workspace]
members = ["packages/sglang-processor"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: downloads and runs the pinned language model",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "llm_steganography",
    "llm_steganography_api",
    "llm_steganography_sglang",
]

[[tool.mypy.overrides]]
module = ["reedsolo"]
ignore_missing_imports = true
