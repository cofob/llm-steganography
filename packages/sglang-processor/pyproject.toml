[project]
name = "llm-steganography-sglang"
version = "0.1.0"
description = "SGLang logits processor for llm-steganography"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Cofob"
license-files = ["LICENSE"]
dependencies = [
    "blake3>=1.0.5,<2",
    "dill>=0.3.8,<1",
    "numpy>=2.1,<3",
]

[project.urls]
License = "https://cofob.dev/license/"
Repository = "https://github.com/cofob/llm-steganography"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_steganography_sglang"]
